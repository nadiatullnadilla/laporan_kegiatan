<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2450" viewBox="0 0 1800 2450">
  <defs>
    <style>
      .bg { fill: #f6f8fb; }
      .title { font: 700 38px Arial, sans-serif; fill: #102033; }
      .subtitle { font: 400 22px Arial, sans-serif; fill: #526071; }
      .laneTitle { font: 700 25px Arial, sans-serif; fill: #203044; }
      .boxText { font: 600 20px Arial, sans-serif; fill: #102033; }
      .smallText { font: 500 17px Arial, sans-serif; fill: #405066; }
      .label { font: 700 16px Arial, sans-serif; fill: #314158; }
      .box { fill: #ffffff; stroke: #9db0c9; stroke-width: 3; rx: 14; }
      .start { fill: #dff7ed; stroke: #2e9f6e; stroke-width: 3; }
      .process { fill: #ffffff; stroke: #6f8db8; stroke-width: 3; rx: 14; }
      .data { fill: #fff8e1; stroke: #d4a72c; stroke-width: 3; rx: 14; }
      .decision { fill: #eaf2ff; stroke: #4c78b8; stroke-width: 3; }
      .admin { fill: #eef7ff; stroke: #4682b4; stroke-width: 3; rx: 14; }
      .operator { fill: #f2f9f1; stroke: #54a05d; stroke-width: 3; rx: 14; }
      .survey { fill: #fff0f5; stroke: #c65c86; stroke-width: 3; rx: 14; }
      .end { fill: #edf0f4; stroke: #6b7280; stroke-width: 3; }
      .arrow { stroke: #314158; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .lane { fill: #ffffff; stroke: #d8e0ea; stroke-width: 2; rx: 20; }
      .note { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 12; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#314158"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="2450"/>

  <text class="title" x="900" y="70" text-anchor="middle">Flowchart Sistem Pendataan Tamu dan Survey Kepuasan Masyarakat</text>
  <text class="subtitle" x="900" y="108" text-anchor="middle">Berbasis Web Multiuser pada Kantor Kecamatan Bungah Gresik</text>
  <text class="subtitle" x="900" y="140" text-anchor="middle">Studi kasus: buku tamu dan pendataan tamu masih dilakukan secara manual</text>

  <rect class="lane" x="70" y="185" width="520" height="2030"/>
  <rect class="lane" x="640" y="185" width="520" height="2030"/>
  <rect class="lane" x="1210" y="185" width="520" height="2030"/>

  <text class="laneTitle" x="330" y="230" text-anchor="middle">TAMU</text>
  <text class="laneTitle" x="900" y="230" text-anchor="middle">SISTEM</text>
  <text class="laneTitle" x="1470" y="230" text-anchor="middle">ADMIN / OPERATOR</text>

  <ellipse class="start" cx="900" cy="305" rx="145" ry="48"/>
  <text class="boxText" x="900" y="313" text-anchor="middle">Mulai</text>

  <rect class="process" x="760" y="390" width="280" height="78"/>
  <text class="boxText" x="900" y="421" text-anchor="middle">Dashboard Utama</text>
  <text class="smallText" x="900" y="447" text-anchor="middle">Dapat diakses seluruh pengguna</text>

  <polygon class="decision" points="900,525 1045,605 900,685 755,605"/>
  <text class="boxText" x="900" y="600" text-anchor="middle">Pilih</text>
  <text class="boxText" x="900" y="627" text-anchor="middle">Pengguna</text>

  <rect class="process" x="190" y="565" width="280" height="80"/>
  <text class="boxText" x="330" y="598" text-anchor="middle">Form Buku Tamu</text>
  <text class="smallText" x="330" y="625" text-anchor="middle">Input data kunjungan</text>

  <rect class="process" x="190" y="725" width="280" height="76"/>
  <text class="boxText" x="330" y="756" text-anchor="middle">Masukkan</text>
  <text class="boxText" x="330" y="782" text-anchor="middle">Nama Tamu</text>

  <rect class="process" x="190" y="850" width="280" height="76"/>
  <text class="boxText" x="330" y="881" text-anchor="middle">Masukkan</text>
  <text class="boxText" x="330" y="907" text-anchor="middle">No. Telepon</text>

  <rect class="process" x="190" y="975" width="280" height="76"/>
  <text class="boxText" x="330" y="1006" text-anchor="middle">Masukkan</text>
  <text class="boxText" x="330" y="1032" text-anchor="middle">Keperluan</text>

  <rect class="process" x="190" y="1100" width="280" height="76"/>
  <text class="boxText" x="330" y="1131" text-anchor="middle">Pilih</text>
  <text class="boxText" x="330" y="1157" text-anchor="middle">Pelayanan</text>

  <rect class="process" x="155" y="1225" width="350" height="86"/>
  <text class="boxText" x="330" y="1257" text-anchor="middle">Masukkan Nomor /</text>
  <text class="boxText" x="330" y="1284" text-anchor="middle">Pegawai yang Dihubungi</text>

  <polygon class="decision" points="330,1370 475,1450 330,1530 185,1450"/>
  <text class="boxText" x="330" y="1445" text-anchor="middle">Done /</text>
  <text class="boxText" x="330" y="1472" text-anchor="middle">Cancel?</text>

  <rect class="data" x="760" y="1410" width="280" height="86"/>
  <text class="boxText" x="900" y="1442" text-anchor="middle">Simpan Data Tamu</text>
  <text class="smallText" x="900" y="1469" text-anchor="middle">ke database db_tamu</text>

  <rect class="data" x="735" y="1555" width="330" height="120"/>
  <text class="boxText" x="900" y="1586" text-anchor="middle">db_tamu</text>
  <text class="smallText" x="900" y="1614" text-anchor="middle">id, nama_tamu, no_telp</text>
  <text class="smallText" x="900" y="1640" text-anchor="middle">keperluan, pilih_pelayanan</text>
  <text class="smallText" x="900" y="1666" text-anchor="middle">status</text>

  <rect class="process" x="755" y="1735" width="290" height="78"/>
  <text class="boxText" x="900" y="1766" text-anchor="middle">Status Tamu</text>
  <text class="smallText" x="900" y="1792" text-anchor="middle">Menunggu verifikasi</text>

  <rect class="survey" x="155" y="1705" width="350" height="88"/>
  <text class="boxText" x="330" y="1738" text-anchor="middle">Survey Kepuasan</text>
  <text class="smallText" x="330" y="1766" text-anchor="middle">11 pertanyaan dalam 1 lembar</text>

  <rect class="survey" x="155" y="1855" width="350" height="92"/>
  <text class="boxText" x="330" y="1888" text-anchor="middle">Pilih Jawaban Survey</text>
  <text class="smallText" x="330" y="1916" text-anchor="middle">4 pilihan ganda per pertanyaan</text>

  <rect class="data" x="760" y="1890" width="280" height="78"/>
  <text class="boxText" x="900" y="1921" text-anchor="middle">Simpan Data</text>
  <text class="smallText" x="900" y="1947" text-anchor="middle">Survey masyarakat</text>

  <ellipse class="end" cx="900" cy="2075" rx="145" ry="48"/>
  <text class="boxText" x="900" y="2083" text-anchor="middle">Selesai</text>

  <rect class="process" x="1330" y="565" width="280" height="80"/>
  <text class="boxText" x="1470" y="598" text-anchor="middle">Login</text>
  <text class="smallText" x="1470" y="625" text-anchor="middle">Admin / Operator</text>

  <polygon class="decision" points="1470,710 1615,790 1470,870 1325,790"/>
  <text class="boxText" x="1470" y="785" text-anchor="middle">Validasi</text>
  <text class="boxText" x="1470" y="812" text-anchor="middle">Login</text>

  <polygon class="decision" points="1470,935 1615,1015 1470,1095 1325,1015"/>
  <text class="boxText" x="1470" y="1010" text-anchor="middle">Hak</text>
  <text class="boxText" x="1470" y="1037" text-anchor="middle">Akses</text>

  <rect class="admin" x="1245" y="1160" width="275" height="88"/>
  <text class="boxText" x="1383" y="1193" text-anchor="middle">Dashboard Admin</text>
  <text class="smallText" x="1383" y="1221" text-anchor="middle">RUD data tamu</text>

  <rect class="operator" x="1540" y="1160" width="165" height="88"/>
  <text class="boxText" x="1623" y="1193" text-anchor="middle">Dashboard</text>
  <text class="boxText" x="1623" y="1221" text-anchor="middle">Operator</text>

  <rect class="admin" x="1245" y="1310" width="275" height="110"/>
  <text class="boxText" x="1383" y="1342" text-anchor="middle">Kelola Data Tamu</text>
  <text class="smallText" x="1383" y="1370" text-anchor="middle">Lihat, ubah, hapus</text>
  <text class="smallText" x="1383" y="1396" text-anchor="middle">dan konfirmasi status</text>

  <rect class="operator" x="1540" y="1310" width="165" height="110"/>
  <text class="boxText" x="1623" y="1342" text-anchor="middle">Verifikasi</text>
  <text class="boxText" x="1623" y="1369" text-anchor="middle">Status</text>
  <text class="smallText" x="1623" y="1396" text-anchor="middle">Tamu</text>

  <rect class="process" x="1285" y="1485" width="360" height="86"/>
  <text class="boxText" x="1465" y="1518" text-anchor="middle">Laporan Rekap Tamu</text>
  <text class="smallText" x="1465" y="1546" text-anchor="middle">Tanggal, bulan, triwulan, semester, tahun</text>

  <rect class="process" x="1285" y="1635" width="360" height="86"/>
  <text class="boxText" x="1465" y="1668" text-anchor="middle">Export / Cetak Laporan</text>
  <text class="smallText" x="1465" y="1696" text-anchor="middle">Excel dan cetak rekap</text>

  <ellipse class="end" cx="1465" cy="1830" rx="145" ry="48"/>
  <text class="boxText" x="1465" y="1838" text-anchor="middle">Selesai</text>

  <rect class="note" x="125" y="2265" width="1550" height="145"/>
  <text class="boxText" x="160" y="2303">Keterangan:</text>
  <text class="smallText" x="160" y="2334">Admin dapat melihat, mengubah, menghapus data tamu, mengonfirmasi status, memfilter laporan, export Excel, dan mencetak laporan.</text>
  <text class="smallText" x="160" y="2362">Operator dapat memverifikasi status tamu, melihat laporan rekap, dan mencetak laporan.</text>
  <text class="smallText" x="160" y="2390">Tamu mengisi buku tamu dan survey kepuasan masyarakat berisi 11 pertanyaan dengan 4 pilihan ganda pada satu halaman.</text>

  <path class="arrow" d="M900 353 L900 390"/>
  <path class="arrow" d="M900 468 L900 525"/>
  <path class="arrow" d="M755 605 L470 605"/>
  <text class="label" x="605" y="585" text-anchor="middle">Tamu</text>
  <path class="arrow" d="M1045 605 L1330 605"/>
  <text class="label" x="1195" y="585" text-anchor="middle">Admin / Operator</text>

  <path class="arrow" d="M330 645 L330 725"/>
  <path class="arrow" d="M330 801 L330 850"/>
  <path class="arrow" d="M330 926 L330 975"/>
  <path class="arrow" d="M330 1051 L330 1100"/>
  <path class="arrow" d="M330 1176 L330 1225"/>
  <path class="arrow" d="M330 1311 L330 1370"/>

  <path class="arrow" d="M475 1450 L760 1450"/>
  <text class="label" x="618" y="1430" text-anchor="middle">Done</text>
  <path class="arrow" d="M185 1450 C105 1450 105 605 190 605"/>
  <text class="label" x="115" y="1215" text-anchor="middle">Cancel</text>

  <path class="arrow" d="M900 1496 L900 1555"/>
  <path class="arrow" d="M900 1675 L900 1735"/>
  <path class="arrow" d="M755 1774 L505 1750"/>
  <path class="arrow" d="M330 1793 L330 1855"/>
  <path class="arrow" d="M505 1901 L760 1929"/>
  <path class="arrow" d="M900 1968 L900 2027"/>

  <path class="arrow" d="M1470 645 L1470 710"/>
  <path class="arrow" d="M1325 790 C1240 790 1240 605 1330 605"/>
  <text class="label" x="1275" y="710" text-anchor="middle">Gagal</text>
  <path class="arrow" d="M1470 870 L1470 935"/>
  <text class="label" x="1505" y="910">Berhasil</text>
  <path class="arrow" d="M1425 1070 L1383 1160"/>
  <text class="label" x="1376" y="1124" text-anchor="middle">Admin</text>
  <path class="arrow" d="M1515 1070 L1623 1160"/>
  <text class="label" x="1600" y="1124" text-anchor="middle">Operator</text>
  <path class="arrow" d="M1383 1248 L1383 1310"/>
  <path class="arrow" d="M1623 1248 L1623 1310"/>
  <path class="arrow" d="M1383 1420 L1430 1485"/>
  <path class="arrow" d="M1623 1420 L1500 1485"/>
  <path class="arrow" d="M1465 1571 L1465 1635"/>
  <path class="arrow" d="M1465 1721 L1465 1782"/>
</svg>
